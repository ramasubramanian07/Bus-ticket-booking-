<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #f5f5f5;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* ========== PAGE DISPLAY ==========*/
        .page {
            display: none;
            padding: 30px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .page.show {
            display: block;
        }

        /* ========== FORM PAGE ==========*/
        .form-header {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
            background: white;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group-wrapper {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            top: 100%;
            left: 0;
            right: 0;
        }

        .autocomplete-list.show {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #eee;
        }

        .autocomplete-item:hover {
            background: #f0f0f0;
        }

        .buy-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* ========== TICKET PAGE ==========*/
        .ticket-header {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .ticket-header h2 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .ticket-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .ticket-container {
            background: #e8d4f8;
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #999;
        }

        .ticket-row:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .ticket-label {
            font-size: 12px;
            color: #555;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticket-value {
            font-size: 16px;
            color: #000;
            font-weight: 600;
            text-align: right;
        }

        .ticket-section {
            margin: 20px 0;
            text-align: center;
        }

        .ticket-section h3 {
            font-size: 18px;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .ticket-section p {
            font-size: 13px;
            color: #666;
        }

        .ticket-routes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }

        .ticket-route {
            text-align: center;
            flex: 1;
        }

        .ticket-route-location {
            font-size: 16px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
        }

        .ticket-arrow {
            font-size: 24px;
            color: #667eea;
            margin: 0 10px;
        }

        .ticket-amount {
            text-align: center;
            margin: 20px 0;
        }

        .ticket-amount-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .ticket-amount-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .ticket-footer {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #999;
            font-style: italic;
        }

        .go-back-btn {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.95);
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .go-back-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                border-radius: 0;
            }
            .page {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== FORM PAGE ==========-->
        <div id="formPage" class="page show">
            <div class="form-header">
                <h1>Book Your Ticket</h1>
                <p>Quick and Easy Booking</p>
            </div>

            <form id="ticketForm">
                <!-- Bus Number -->
                <div class="form-group">
                    <label>Bus Number</label>
                    <input type="text" id="inputBusNo" placeholder="e.g., 154" required>
                </div>

                <!-- Date -->
                <div class="form-group">
                    <label>Date</label>
                    <input type="text" id="inputDate" placeholder="DD/MM/YYYY" readonly>
                </div>

                <!-- From -->
                <div class="form-group form-group-wrapper">
                    <label>From</label>
                    <input type="text" id="inputFrom" placeholder="Enter starting point" autocomplete="off" required>
                    <div class="autocomplete-list" id="fromSuggestions"></div>
                </div>

                <!-- To -->
                <div class="form-group form-group-wrapper">
                    <label>To</label>
                    <input type="text" id="inputTo" placeholder="Enter destination" autocomplete="off" required>
                    <div class="autocomplete-list" id="toSuggestions"></div>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label>Amount (Rs.)</label>
                    <input type="number" id="inputAmount" placeholder="e.g., 15" min="1" step="0.01" required>
                </div>

                <!-- Buy Button -->
                <button type="submit" class="buy-btn">Buy Ticket</button>
            </form>
        </div>

        <!-- ========== TICKET PAGE ==========-->
        <div id="ticketPage" class="page">
            <div class="ticket-header">
                <h2>Your bus ticket for <span id="displayBusNo">154</span> bus is ready!</h2>
                <p>You can view your ticket details below.</p>
            </div>

            <div class="ticket-container">
                <!-- Bus Title -->
                <div class="ticket-section">
                    <h3>மா. பெ. க. (சென்னை)</h3>
                    <p>KATHIPARA</p>
                </div>

                <!-- Ticket Info -->
                <div class="ticket-row">
                    <div>
                        <div class="ticket-label">T No</div>
                        <div class="ticket-value" id="displayTicketNo">420212617</div>
                    </div>
                    <div>
                        <div class="ticket-label">Date</div>
                        <div class="ticket-value" id="displayDate">09/17/2026</div>
                    </div>
                    <div>
                        <div class="ticket-label">Time</div>
                        <div class="ticket-value" id="displayTime">07:18</div>
                    </div>
                </div>

                <!-- Routes -->
                <div class="ticket-routes">
                    <div class="ticket-route">
                        <div class="ticket-route-location" id="displayFrom">KATHIPARA</div>
                    </div>
                    <div class="ticket-arrow">→</div>
                    <div class="ticket-route">
                        <div class="ticket-route-location" id="displayTo">D.L.F.</div>
                    </div>
                </div>

                <!-- Amount -->
                <div class="ticket-amount">
                    <div class="ticket-amount-label">Total Amount</div>
                    <div class="ticket-amount-value">₹ <span id="displayAmount">15.00</span></div>
                </div>

                <!-- Footer -->
                <div class="ticket-footer">
                    மொட்டார் வாகனம் விதிக்குக்குட்டட்டு
                </div>
            </div>

            <button class="go-back-btn" id="goBackBtn">Go Back</button>
        </div>
    </div>

    <script>
        // ========== WAIT FOR PAGE LOAD ==========
        window.addEventListener('load', function() {
            console.log('✅ Page fully loaded');
            initApp();
        });

        function initApp() {
            // DOM Elements
            const formPage = document.getElementById('formPage');
            const ticketPage = document.getElementById('ticketPage');
            const ticketForm = document.getElementById('ticketForm');
            const goBackBtn = document.getElementById('goBackBtn');

            // Form inputs
            const inputBusNo = document.getElementById('inputBusNo');
            const inputDate = document.getElementById('inputDate');
            const inputFrom = document.getElementById('inputFrom');
            const inputTo = document.getElementById('inputTo');
            const inputAmount = document.getElementById('inputAmount');

            // Ticket displays
            const displayBusNo = document.getElementById('displayBusNo');
            const displayTicketNo = document.getElementById('displayTicketNo');
            const displayDate = document.getElementById('displayDate');
            const displayTime = document.getElementById('displayTime');
            const displayFrom = document.getElementById('displayFrom');
            const displayTo = document.getElementById('displayTo');
            const displayAmount = document.getElementById('displayAmount');

            // Autocomplete
            const fromSuggestions = document.getElementById('fromSuggestions');
            const toSuggestions = document.getElementById('toSuggestions');

            // ========== SET TODAY'S DATE ==========
            function setTodayDate() {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = today.getFullYear();
                inputDate.value = `${day}/${month}/${year}`;
                console.log('✅ Date set:', inputDate.value);
            }

            setTodayDate();

            // ========== AUTOCOMPLETE FUNCTIONS ==========
            function getSavedStops() {
                const saved = localStorage.getItem('busStops');
                return saved ? JSON.parse(saved) : { from: [], to: [] };
            }

            function saveSuggestion(type, value) {
                const stops = getSavedStops();
                const upper = value.toUpperCase();
                if (!stops[type].includes(upper)) {
                    stops[type].unshift(upper);
                    stops[type] = stops[type].slice(0, 10); // Keep only 10
                }
                localStorage.setItem('busStops', JSON.stringify(stops));
            }

            function showSuggestions(input, type, listElement) {
                const stops = getSavedStops();
                const matches = stops[type].filter(s => 
                    s.toLowerCase().includes(input.toLowerCase())
                );

                listElement.innerHTML = '';
                if (input.trim() === '' || matches.length === 0) {
                    listElement.classList.remove('show');
                    return;
                }

                matches.forEach(stop => {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.textContent = stop;
                    item.onclick = () => {
                        if (type === 'from') inputFrom.value = stop;
                        else inputTo.value = stop;
                        listElement.classList.remove('show');
                    };
                    listElement.appendChild(item);
                });

                listElement.classList.add('show');
            }

            // From suggestions
            inputFrom.addEventListener('input', () => {
                showSuggestions(inputFrom.value, 'from', fromSuggestions);
            });

            inputFrom.addEventListener('focus', () => {
                if (inputFrom.value) showSuggestions(inputFrom.value, 'from', fromSuggestions);
            });

            inputFrom.addEventListener('blur', () => {
                setTimeout(() => fromSuggestions.classList.remove('show'), 150);
            });

            // To suggestions
            inputTo.addEventListener('input', () => {
                showSuggestions(inputTo.value, 'to', toSuggestions);
            });

            inputTo.addEventListener('focus', () => {
                if (inputTo.value) showSuggestions(inputTo.value, 'to', toSuggestions);
            });

            inputTo.addEventListener('blur', () => {
                setTimeout(() => toSuggestions.classList.remove('show'), 150);
            });

            // ========== FORM SUBMIT ==========
            ticketForm.addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('🎟️ Submitting ticket form...');

                // Get values and convert to uppercase
                const busNo = inputBusNo.value.trim();
                const date = inputDate.value;
                const fromStop = inputFrom.value.trim().toUpperCase();
                const toStop = inputTo.value.trim().toUpperCase();
                const amount = parseFloat(inputAmount.value).toFixed(2);

                if (!busNo || !fromStop || !toStop || !amount) {
                    alert('Please fill all fields');
                    return;
                }

                // Get current time
                const now = new Date();
                const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

                // Generate ticket number
                const ticketNo = Math.floor(Date.now() / 1000) % 1000000000;

                console.log('📝 Ticket data:', { busNo, date, fromStop, toStop, amount, time, ticketNo });

                // Save suggestions
                saveSuggestion('from', fromStop);
                saveSuggestion('to', toStop);

                // Update ticket display
                displayBusNo.textContent = busNo;
                displayTicketNo.textContent = ticketNo;
                displayDate.textContent = date;
                displayTime.textContent = time;
                displayFrom.textContent = fromStop;
                displayTo.textContent = toStop;
                displayAmount.textContent = amount;

                console.log('✅ Ticket display updated');

                // Show ticket page
                formPage.classList.remove('show');
                ticketPage.classList.add('show');
                console.log('✅ Switched to ticket page');
            });

            // ========== GO BACK BUTTON ==========
            goBackBtn.addEventListener('click', function() {
                console.log('↩️ Going back to form');
                ticketForm.reset();
                setTodayDate();
                fromSuggestions.classList.remove('show');
                toSuggestions.classList.remove('show');
                ticketPage.classList.remove('show');
                formPage.classList.add('show');
                inputBusNo.focus();
            });

            console.log('✅ App initialized successfully');
        }
    </script>
</body>
</html>
